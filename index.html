<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <title>VideoVault</title>
    <link rel="stylesheet" href="/src/style.css" />

    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .line-clamp-1 {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .fab-safe-bottom {
        bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      }
      :focus-visible {
        outline: 2px solid #a855f7;
        outline-offset: 2px;
        border-radius: 6px;
      }

      .ripple-container {
        position: relative;
        overflow: hidden;
      }
      .ripple-el {
        position: absolute;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.35);
        transform: scale(0);
        animation: rippleAnim 0.6s ease-out;
        pointer-events: none;
      }
      @keyframes rippleAnim {
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-card-in {
        animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.05);
      }
      .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.08),
          transparent
        );
        animation: shimmer 1.6s ease-in-out infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes blobDrift1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(34px, -44px) scale(1.15);
        }
      }
      @keyframes blobDrift2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-28px, 38px) scale(1.1);
        }
      }

      @keyframes floatY {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      .animate-float {
        animation: floatY 3.4s ease-in-out infinite;
      }
      .animate-float-d1 {
        animation: floatY 3.6s ease-in-out infinite;
        animation-delay: 0.5s;
      }
      .animate-float-d2 {
        animation: floatY 4s ease-in-out infinite;
        animation-delay: 1s;
      }

      @keyframes pingSlow {
        0% {
          transform: scale(1);
          opacity: 0.45;
        }
        70%,
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      .animate-ping-slow {
        animation: pingSlow 2.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .toast {
        opacity: 0;
        transform: translateY(-14px) scale(0.96);
        transition:
          opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .toast-show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    </style>
  </head>
  <body
    class="bg-[#050507] text-zinc-100 min-h-screen flex flex-col antialiased font-sans overflow-x-hidden"
  >
    <!-- Ambient glow background -->
    <div
      aria-hidden="true"
      class="fixed inset-0 overflow-hidden pointer-events-none"
    >
      <div
        class="absolute -top-20 -left-16 w-72 h-72 rounded-full bg-indigo-500/20 blur-[90px]"
        style="animation: blobDrift1 14s ease-in-out infinite"
      ></div>
      <div
        class="absolute top-1/3 -right-24 w-80 h-80 rounded-full bg-purple-500/20 blur-[100px]"
        style="animation: blobDrift2 17s ease-in-out infinite"
      ></div>
      <div
        class="absolute bottom-10 left-1/4 w-64 h-64 rounded-full bg-indigo-500/10 blur-[90px]"
        style="animation: blobDrift1 19s ease-in-out infinite reverse"
      ></div>
    </div>

    <!-- Top Navbar -->
    <header class="sticky top-0 z-40 pt-safe">
      <div
        class="absolute inset-0 bg-[#0e0e14]/70 backdrop-blur-xl border-b border-white/[0.06]"
      ></div>
      <div
        class="relative px-4 py-3.5 flex items-center justify-between max-w-2xl mx-auto"
      >
        <div class="flex items-center gap-2.5">
          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/40 flex-shrink-0"
          >
            <svg
              class="w-4 h-4 text-white"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M6 4.2c0-.9.98-1.44 1.73-.96l12.4 7.8a1.14 1.14 0 0 1 0 1.92l-12.4 7.8A1.14 1.14 0 0 1 6 19.8V4.2Z"
              />
            </svg>
          </div>
          <div>
            <h1 class="font-bold text-[17px] tracking-tight leading-none">
              VideoVault
            </h1>
            <p id="video-count" class="text-[11px] text-zinc-500 mt-1">
              Memuat…
            </p>
          </div>
        </div>

        <div class="relative">
          <button
            id="btn-sort"
            data-ripple
            class="ripple-container w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-zinc-300 hover:text-white hover:bg-white/10 active:scale-90 transition-all"
            aria-label="Urutkan video"
          >
            <svg
              class="w-[18px] h-[18px]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 4v16M7 4 3 8M7 4l4 4" />
              <path d="M17 20V4M17 20l4-4M17 20l-4-4" />
            </svg>
          </button>

          <div
            id="sort-panel"
            class="absolute right-0 top-[52px] z-50 w-52 rounded-2xl bg-[#0e0e14]/95 backdrop-blur-2xl border border-white/10 shadow-2xl shadow-black/50 p-1.5 origin-top-right scale-95 opacity-0 pointer-events-none transition-all duration-200"
          >
            <p
              class="px-3 pt-2 pb-1.5 text-[10.5px] font-semibold uppercase tracking-wider text-zinc-500"
            >
              Urutkan berdasarkan
            </p>
            <button
              data-sort="newest"
              data-ripple
              class="sort-option ripple-container w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-[13px] text-zinc-300 hover:bg-white/5 transition"
            >
              <span>Terbaru</span>
              <svg
                class="sort-check w-4 h-4 text-purple-400 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
            <button
              data-sort="oldest"
              data-ripple
              class="sort-option ripple-container w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-[13px] text-zinc-300 hover:bg-white/5 transition"
            >
              <span>Terlama</span>
              <svg
                class="sort-check w-4 h-4 text-purple-400 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
            <button
              data-sort="title"
              data-ripple
              class="sort-option ripple-container w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-[13px] text-zinc-300 hover:bg-white/5 transition"
            >
              <span>Judul A-Z</span>
              <svg
                class="sort-check w-4 h-4 text-purple-400 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
            <button
              data-sort="category"
              data-ripple
              class="sort-option ripple-container w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-[13px] text-zinc-300 hover:bg-white/5 transition"
            >
              <span>Kategori</span>
              <svg
                class="sort-check w-4 h-4 text-purple-400 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Search & Category Filter -->
    <section class="relative px-4 pt-4 pb-1 max-w-2xl mx-auto w-full space-y-3">
      <div class="relative">
        <svg
          class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Cari judul video..."
          class="w-full bg-white/5 border border-white/10 rounded-2xl pl-10 pr-9 py-3 text-sm placeholder-zinc-500 focus:outline-none focus:border-purple-400/50 focus:bg-white/[0.07] focus:ring-4 focus:ring-purple-400/10 transition-all"
        />
        <button
          id="btn-clear-search"
          class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition"
          aria-label="Hapus pencarian"
        >
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div
        id="category-filters"
        class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 text-xs"
      ></div>
    </section>

    <!-- Video Grid Container -->
    <main class="relative flex-1 px-4 max-w-2xl mx-auto w-full pb-28">
      <div
        id="skeleton-grid"
        class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2"
      >
        <div
          class="rounded-2xl overflow-hidden bg-white/[0.03] border border-white/[0.06]"
        >
          <div class="aspect-video skeleton"></div>
          <div class="p-3 space-y-2.5">
            <div class="h-3 w-4/5 rounded-full skeleton"></div>
            <div class="h-3 w-2/5 rounded-full skeleton"></div>
          </div>
        </div>
        <div
          class="rounded-2xl overflow-hidden bg-white/[0.03] border border-white/[0.06]"
        >
          <div class="aspect-video skeleton"></div>
          <div class="p-3 space-y-2.5">
            <div class="h-3 w-4/5 rounded-full skeleton"></div>
            <div class="h-3 w-2/5 rounded-full skeleton"></div>
          </div>
        </div>
      </div>

      <div
        id="video-grid"
        class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2"
      ></div>

      <div id="empty-state" class="hidden text-center py-16 px-6">
        <div class="relative w-28 h-28 mx-auto mb-5">
          <div
            class="absolute inset-0 rounded-full bg-gradient-to-br from-indigo-500/25 to-purple-500/25 blur-2xl"
          ></div>
          <div
            class="absolute inset-0 rounded-full border border-white/10 bg-white/[0.03] backdrop-blur-sm flex items-center justify-center animate-float"
          >
            <svg
              class="w-9 h-9 text-zinc-500"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="M9.5 9v6l5-3-5-3Z" fill="currentColor" stroke="none" />
            </svg>
          </div>
          <span
            class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-purple-400/70 animate-float-d1"
          ></span>
          <span
            class="absolute bottom-3 -left-2 w-2 h-2 rounded-full bg-indigo-400/70 animate-float-d2"
          ></span>
        </div>
        <p class="font-semibold text-base text-zinc-200">
          Vault kamu masih kosong
        </p>
        <p
          class="text-zinc-500 text-[13px] mt-1.5 max-w-[240px] mx-auto leading-relaxed"
        >
          Simpan video favoritmu di sini agar mudah ditemukan kapan saja, bahkan
          saat offline.
        </p>
        <button
          id="btn-empty-add"
          data-ripple
          class="ripple-container mt-5 inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-medium px-4 py-2.5 rounded-xl transition active:scale-95"
        >
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          Tambah Video Pertama
        </button>
      </div>

      <div id="scroll-sentinel" class="h-16 flex items-center justify-center">
        <div
          id="loading-more"
          class="hidden w-5 h-5 rounded-full border-2 border-white/15 border-t-purple-400 animate-spin"
        ></div>
      </div>
    </main>

    <!-- FAB -->
    <button
      id="btn-open-modal"
      data-ripple
      class="ripple-container fixed fab-safe-bottom right-5 z-40 w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500 shadow-[0_10px_35px_-8px_rgba(99,102,241,0.7)] flex items-center justify-center text-white active:scale-90 transition-transform"
      aria-label="Tambah video"
    >
      <span
        class="absolute inset-0 rounded-2xl bg-purple-400 animate-ping-slow"
      ></span>
      <svg
        class="relative w-6 h-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <!-- Modal Form -->
    <div
      id="modal-backdrop"
      class="fixed inset-0 z-[90] bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"
    ></div>
    <div
      id="modal"
      class="fixed inset-0 z-[95] flex items-end sm:items-center justify-center p-0 sm:p-4 pointer-events-none"
    >
      <div
        id="modal-panel"
        class="relative w-full sm:max-w-md bg-[#0e0e14]/95 backdrop-blur-2xl border border-white/10 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto"
      >
        <div
          class="flex items-center justify-between border-b border-white/[0.06] pb-3 mb-4"
        >
          <h3 id="modal-title" class="font-semibold text-base">Tambah Video</h3>
          <button
            id="btn-close-modal"
            data-ripple
            class="ripple-container w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/5 transition"
            aria-label="Tutup"
          >
            <svg
              class="w-[18px] h-[18px]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="video-form" class="space-y-4">
          <input type="hidden" id="form-id" />
          <div>
            <label
              for="form-title"
              class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wide mb-1.5"
              >Judul Video</label
            >
            <div class="relative">
              <svg
                class="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 6h16M4 12h10M4 18h7" />
              </svg>
              <input
                type="text"
                id="form-title"
                required
                class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-purple-400/50 focus:ring-4 focus:ring-purple-400/10 transition-all"
                placeholder="Contoh: Belajar Neovim Dasar"
              />
            </div>
          </div>
          <div>
            <label
              for="form-url"
              class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wide mb-1.5"
              >URL Video</label
            >
            <div class="relative">
              <svg
                class="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"
                />
              </svg>
              <input
                type="url"
                id="form-url"
                required
                class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-purple-400/50 focus:ring-4 focus:ring-purple-400/10 transition-all"
                placeholder="https://..."
              />
            </div>
          </div>
          <div>
            <label
              class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wide mb-1.5"
              >Thumbnail
              <span class="normal-case text-zinc-600">(opsional)</span></label
            >
            <div class="flex gap-2.5">
              <div
                id="thumb-preview-box"
                class="relative flex-shrink-0 w-20 aspect-video rounded-lg overflow-hidden bg-white/5 border border-white/10 flex items-center justify-center"
              >
                <svg
                  id="thumb-placeholder-icon"
                  class="w-5 h-5 text-zinc-600"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="9" cy="9" r="2" />
                  <path d="m21 15-5-5L5 21" />
                </svg>
                <img
                  id="thumb-preview-img"
                  class="hidden absolute inset-0 w-full h-full object-cover"
                  alt="Pratinjau thumbnail"
                />
              </div>
              <div class="relative flex-1">
                <svg
                  class="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"
                  />
                  <path
                    d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"
                  />
                </svg>
                <input
                  type="url"
                  id="form-thumbnail"
                  class="w-full h-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 text-sm focus:outline-none focus:border-purple-400/50 focus:ring-4 focus:ring-purple-400/10 transition-all"
                  placeholder="https://..."
                />
              </div>
            </div>
          </div>
          <div>
            <label
              for="form-category"
              class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wide mb-1.5"
              >Kategori</label
            >
            <div class="relative">
              <svg
                class="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2.7 10.3a2.4 2.4 0 0 0 0 3.4l7.6 7.6a2.4 2.4 0 0 0 3.4 0l7.6-7.6a2.4 2.4 0 0 0 .7-1.7V4a2 2 0 0 0-2-2h-7.7a2.4 2.4 0 0 0-1.7.7Z"
                />
                <circle cx="7.5" cy="7.5" r="1.5" />
              </svg>
              <input
                type="text"
                id="form-category"
                list="category-datalist"
                required
                autocomplete="off"
                class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-purple-400/50 focus:ring-4 focus:ring-purple-400/10 transition-all"
                placeholder="Contoh: Edukasi, Musik, Game"
              />
              <datalist id="category-datalist"></datalist>
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button
              type="button"
              id="btn-cancel"
              data-ripple
              class="ripple-container w-1/2 bg-white/5 hover:bg-white/10 border border-white/10 text-zinc-300 text-sm font-medium py-2.5 rounded-xl transition active:scale-95"
            >
              Batal
            </button>
            <button
              type="submit"
              data-ripple
              class="ripple-container w-1/2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:brightness-110 text-white text-sm font-medium py-2.5 rounded-xl transition active:scale-95 shadow-lg shadow-indigo-500/25"
            >
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Quick Action Bottom Sheet -->
    <div
      id="sheet-backdrop"
      class="fixed inset-0 z-[60] bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"
    ></div>
    <div
      id="bottom-sheet"
      class="fixed left-0 right-0 bottom-0 z-[70] translate-y-full transition-transform duration-300"
      style="transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1)"
    >
      <div
        class="mx-auto max-w-2xl bg-[#0e0e14]/95 backdrop-blur-2xl border-t border-white/10 rounded-t-3xl px-4 pt-3 pb-safe shadow-2xl"
      >
        <div class="w-9 h-1 rounded-full bg-white/15 mx-auto mb-3"></div>
        <div
          class="flex items-center gap-3 pb-3 mb-1 border-b border-white/[0.06]"
        >
          <img
            id="sheet-thumb"
            class="w-16 h-10 rounded-lg object-cover bg-zinc-800 flex-shrink-0"
            alt=""
          />
          <h4 id="sheet-title" class="text-sm font-semibold line-clamp-1"></h4>
        </div>
        <div class="py-1.5">
          <button
            id="sheet-preview"
            data-ripple
            class="sheet-item ripple-container w-full flex items-center gap-3 px-2 py-3 rounded-xl active:bg-white/5 transition text-left"
          >
            <span
              class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-zinc-300"
              ><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M6 4.2c0-.9.98-1.44 1.73-.96l12.4 7.8a1.14 1.14 0 0 1 0 1.92l-12.4 7.8A1.14 1.14 0 0 1 6 19.8V4.2Z"
                /></svg
            ></span>
            <span class="text-sm font-medium">Preview Video</span>
          </button>
          <button
            id="sheet-copy"
            data-ripple
            class="sheet-item ripple-container w-full flex items-center gap-3 px-2 py-3 rounded-xl active:bg-white/5 transition text-left"
          >
            <span
              class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-zinc-300"
              ><svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path
                  d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                /></svg
            ></span>
            <span class="text-sm font-medium">Salin Link</span>
          </button>
          <button
            id="sheet-edit"
            data-ripple
            class="sheet-item ripple-container w-full flex items-center gap-3 px-2 py-3 rounded-xl active:bg-white/5 transition text-left"
          >
            <span
              class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-zinc-300"
              ><svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg
            ></span>
            <span class="text-sm font-medium">Edit Video</span>
          </button>
          <button
            id="sheet-delete"
            data-ripple
            class="sheet-item ripple-container w-full flex items-center gap-3 px-2 py-3 rounded-xl active:bg-rose-500/10 transition text-left"
          >
            <span
              class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center text-rose-400"
              ><svg
                class="w-4 h-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6M14 11v6" /></svg
            ></span>
            <span class="text-sm font-medium text-rose-400">Hapus Video</span>
          </button>
        </div>
        <button
          id="sheet-cancel"
          data-ripple
          class="ripple-container w-full py-3 mt-1 mb-2 rounded-xl bg-white/5 text-sm font-medium text-zinc-300 active:scale-[0.98] transition"
        >
          Batal
        </button>
      </div>
    </div>

    <!-- Preview Modal -->
    <div
      id="preview-modal"
      class="fixed inset-0 z-[80] hidden items-center justify-center p-0 sm:p-4"
    >
      <div
        id="preview-backdrop"
        class="absolute inset-0 bg-black/90 backdrop-blur-md opacity-0 transition-opacity duration-300"
      ></div>
      <div
        id="preview-panel"
        class="relative w-full sm:max-w-lg sm:rounded-2xl overflow-hidden bg-black scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="flex items-center justify-between px-4 py-3 bg-[#0e0e14]/90 backdrop-blur border-b border-white/10"
        >
          <h3
            id="preview-title"
            class="text-sm font-semibold line-clamp-1 pr-3"
          ></h3>
          <button
            id="btn-close-preview"
            data-ripple
            class="ripple-container w-8 h-8 flex-shrink-0 rounded-lg flex items-center justify-center text-zinc-300 hover:bg-white/10 transition"
            aria-label="Tutup preview"
          >
            <svg
              class="w-[18px] h-[18px]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div
          id="preview-content"
          class="relative aspect-video bg-black flex items-center justify-center"
        ></div>
        <div id="preview-fallback" class="hidden p-6 text-center space-y-3">
          <p class="text-sm text-zinc-400">
            Preview tidak tersedia untuk link ini.
          </p>
          <a
            id="preview-external-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-2 text-sm text-purple-400 font-medium hover:underline"
          >
            Buka di Browser
            <svg
              class="w-3.5 h-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h6v6" />
              <path d="M10 14 21 3" />
              <path
                d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast-container"
      class="fixed top-0 inset-x-0 z-[100] flex flex-col items-center gap-2 px-4 pt-safe pt-4 pointer-events-none"
    ></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
