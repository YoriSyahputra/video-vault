<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Video Vault</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#18181b",
              background: "#09090b",
              accent: "#6366f1",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-background text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-accent selection:text-white pb-24"
  >
    <!-- Top Navbar -->
    <header
      class="sticky top-0 z-30 bg-surface/90 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between"
    >
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-white shadow-lg shadow-accent/30"
        >
          V
        </div>
        <h1 class="text-lg font-bold tracking-wide">VideoVault</h1>
      </div>
      <button
        id="btn-open-modal"
        class="bg-accent hover:bg-indigo-600 active:scale-95 text-white text-sm font-medium px-3.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>
        <span>Tambah</span>
      </button>
    </header>

    <!-- Controls: Search & Category Filter -->
    <section class="p-4 space-y-3 max-w-2xl mx-auto w-full">
      <!-- Search Bar -->
      <div class="relative">
        <input
          type="text"
          id="search-input"
          placeholder="Cari judul video..."
          class="w-full bg-surface border border-zinc-800 rounded-xl px-10 py-2.5 text-sm placeholder-zinc-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition"
        />
        <svg
          class="w-4 h-4 text-zinc-500 absolute left-3.5 top-3.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>

      <!-- Filter Categories -->
      <div
        id="category-filters"
        class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs"
      >
        <!-- Dynamic Filter Buttons -->
      </div>
    </section>

    <!-- Video Grid Container -->
    <main class="flex-1 px-4 max-w-2xl mx-auto w-full">
      <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Dynamic Video Cards -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-16 space-y-2">
        <p class="text-zinc-400 font-medium">Belum ada video tersimpan.</p>
        <p class="text-zinc-600 text-xs">
          Ketuk tombol "Tambah" untuk menyimpan link video baru.
        </p>
      </div>
    </main>

    <!-- Form Modal (Tambah/Edit) -->
    <div
      id="modal"
      class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4"
    >
      <div
        class="bg-surface border border-zinc-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl"
      >
        <div
          class="flex items-center justify-between border-b border-zinc-800 pb-3"
        >
          <h3 id="modal-title" class="text-base font-bold">Tambah Video</h3>
          <button
            id="btn-close-modal"
            class="text-zinc-400 hover:text-white text-lg"
          >
            &times;
          </button>
        </div>

        <form id="video-form" class="space-y-3.5">
          <input type="hidden" id="form-id" />
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Judul Video</label>
            <input
              type="text"
              id="form-title"
              required
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent"
              placeholder="Contoh: Belajar Neovim Dasar"
            />
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">URL Video</label>
            <input
              type="url"
              id="form-url"
              required
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent"
              placeholder="https://..."
            />
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1"
              >URL Thumbnail (Opsional)</label
            >
            <input
              type="url"
              id="form-thumbnail"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent"
              placeholder="https://..."
            />
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Kategori</label>
            <input
              type="text"
              id="form-category"
              required
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent"
              placeholder="Contoh: Edukasi, Musik, Game"
            />
          </div>

          <div class="flex gap-2 pt-2">
            <button
              type="button"
              id="btn-cancel"
              class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-medium py-2 rounded-lg transition"
            >
              Batal
            </button>
            <button
              type="submit"
              class="w-1/2 bg-accent hover:bg-indigo-600 text-white text-sm font-medium py-2 rounded-lg transition"
            >
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
